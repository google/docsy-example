version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '20:00'
    open-pull-requests-limit: 10
    # Let new releases age before they enter update PRs; security updates
    # bypass the cooldown.
    cooldown:
      default-days: 7
    ignore:
      # Coupled to the version-pinned allowScripts approval; updated manually
      # via update:hugo + approve:hugo (see the README). Scoped so security
      # updates still open PRs.
      - dependency-name: hugo-extended
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '20:00'
    cooldown:
      default-days: 7
