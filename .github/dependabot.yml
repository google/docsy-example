version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
      time: '20:00'
    open-pull-requests-limit: 10
    # Resolution-axis cooldown: no version younger than 7 days enters an
    # update PR; security updates bypass the cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
      time: '20:00'
    cooldown:
      default-days: 7
